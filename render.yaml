services:
  - type: web
    name: pricehunter
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: DEBUG
        value: false
      - key: DATABASE_PATH
        value: pricehunter.db
